<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Parking | Testes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/roi_editor.css') }}">
</head>

<body>
    <nav class="navbar navbar-dark sp-nav">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/"><i
                    class="bi bi-p-square-fill me-2"></i>Smart Parking</a>
            <div class="navbar-nav ms-auto flex-row gap-3"><a class="nav-link" href="/">Monitoramento</a><a
                    class="nav-link" href="/roi">Configurar vagas</a><a class="nav-link active" href="/tests">Testes</a>
            </div>
        </div>
    </nav>
    <main class="container py-4">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="mb-4">
                    <h2>Testes com vídeos e ângulos</h2>
                    <p class="text-secondary mb-0">Execute o mesmo ambiente em diferentes vídeos, posições e ângulos e
                        exporte os resultados para comparação.</p>
                </div>
                <div class="card sp-card">
                    <div class="card-body p-4"><label class="form-label">Ambiente com vagas salvas</label><select
                            id="environment" class="form-select mb-3">
                            <option value="">Carregando ambientes...</option>
                        </select>
                        <div class="row g-3">
                            <div class="col-md-6"><label class="form-label">Confiança</label><input id="confidence"
                                    class="form-range" type="range" min="0.1" max="0.9" step="0.05" value="0.4"><span
                                    id="confidenceValue">0.40</span></div>
                            <div class="col-md-6"><label class="form-label">Analisar 1 a cada N frames</label><input
                                    id="frameStep" class="form-control" type="number" min="1" value="5"></div>
                        </div>
                        <div class="d-flex gap-2 mt-4"><button id="startTest" class="btn btn-primary"><i
                                    class="bi bi-play-fill me-1"></i>Iniciar teste</button><a href="/roi"
                                class="btn btn-outline-secondary">Voltar ao editor</a></div>
                    </div>
                </div>
                <div id="resultCard" class="card sp-card mt-4 d-none">
                    <div class="card-body p-4">
                        <div class="d-flex justify-content-between"><span id="statusText">Preparando...</span><span
                                id="progressText">0%</span></div>
                        <div class="progress mt-2" style="height:12px">
                            <div id="progressBar" class="progress-bar" style="width:0%"></div>
                        </div>
                        <div id="resultText" class="mt-3 text-secondary"></div><a id="downloadBtn"
                            class="btn btn-success mt-3 d-none"><i class="bi bi-download me-1"></i>Baixar CSV do
                            teste</a>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <script>const api = () => localStorage.getItem('smartparking:roiApiUrl') || 'http://127.0.0.1:5001'; let job = null; async function req(p, o = {}) { let r = await fetch(api() + p, o); if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || 'Erro'); return r } async function load() { let a = await (await req('/api/environments')).json(); environment.innerHTML = '<option value="">Selecione</option>' + a.map(x => `<option>${x}</option>`).join('') } confidence.oninput = () => confidenceValue.textContent = Number(confidence.value).toFixed(2); startTest.onclick = async () => { if (!environment.value) return alert('Selecione um ambiente com vagas salvas.'); try { let r = await req('/api/tests', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ environment: environment.value, confidence: Number(confidence.value), frame_step: Number(frameStep.value) }) }); job = (await r.json()).id; resultCard.classList.remove('d-none'); downloadBtn.classList.add('d-none'); poll() } catch (e) { alert(e.message) } }; async function poll() { let d = await (await req('/api/tests/' + job)).json(); progressBar.style.width = d.progress + '%'; progressText.textContent = d.progress + '%'; statusText.textContent = d.status === 'running' ? 'Analisando vídeo...' : d.status === 'completed' ? 'Teste concluído' : 'Erro'; resultText.textContent = d.status === 'completed' ? `Foram analisados ${d.rows} frames. O CSV contém o estado de cada vaga em cada amostra.` : (d.error || ''); if (d.status === 'running') setTimeout(poll, 1000); if (d.status === 'completed') { downloadBtn.href = api() + '/api/tests/' + job + '/download'; downloadBtn.classList.remove('d-none') } } load();</script>
</body>

</html>
