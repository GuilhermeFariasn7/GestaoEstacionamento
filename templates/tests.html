<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Smart Parking | Testes</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tests.css') }}">
</head>

<body>

    <nav class="navbar navbar-dark sp-nav">
        <div class="container-fluid">
            <span class="navbar-brand fw-semibold">
                <i class="bi bi-p-square-fill me-2"></i>Experimentos
            </span>
        </div>
    </nav>

    <main class="sp-main">

        <header class="sp-page-header">
            <h1>Testes e avaliação</h1>
            <p>Configure o ambiente, escolha o vídeo e inicie a análise.</p>
        </header>

        <section class="sp-form-card">

            <div class="sp-form-scroll">

                <!-- Ambiente -->
                <div class="sp-block">

                    <button id="toggleConfigBtn" type="button" class="btn btn-outline-secondary sp-btn-block">
                        <i class="bi bi-bounding-box me-1"></i>Configurar vagas
                    </button>
                </div>

                <!-- Parâmetros -->
                <div class="sp-block">
                    <h2 class="sp-block-title">
                        <i class="bi bi-sliders"></i>Parâmetros
                    </h2>

                    <div class="sp-field">
                        <label class="sp-label" for="confidence">
                            Confiança YOLO
                            <span id="confidenceValue" class="sp-value">0.40</span>
                        </label>
                        <input id="confidence" class="form-range" type="range" min="0.1" max="0.9" step="0.05"
                            value="0.4">
                        <p class="form-text">
                            Mais alto = menos falsos positivos, mas pode perder carros parcialmente visíveis.
                        </p>
                    </div>

                    <div class="sp-field-row">
                        <div class="sp-field">
                            <label class="sp-label" for="frameStep">Analisar 1 a cada N frames</label>
                            <input id="frameStep" class="form-control" type="number" min="1" value="5">
                        </div>

                        <div class="sp-field sp-field-check">
                            <div class="form-check">
                                <input id="stabilize" class="form-check-input" type="checkbox">
                                <label class="form-check-label" for="stabilize">Estabilização</label>
                            </div>
                        </div>
                    </div>
                </div>

            </div><!-- /.sp-form-scroll -->

            <footer class="sp-form-footer">
                <button id="startTest" class="btn btn-primary sp-btn-primary">
                    <i class="bi bi-play-fill me-1"></i>Iniciar teste
                </button>
            </footer>

        </section>

        <section id="resultCard" class="sp-result-card d-none">
            <div class="sp-result-head">
                <span id="statusText">Preparando...</span>
                <span id="progressText">0%</span>
            </div>
            <div class="progress sp-progress">
                <div id="progressBar" class="progress-bar" style="width:0%"></div>
            </div>
            <div id="resultText" class="sp-result-text"></div>
            <div id="summaryTable" class="sp-summary"></div>
            <div id="actions" class="sp-actions"></div>
        </section>

    </main>

    <!-- Modal: configuração de vagas -->
    <div class="modal fade" id="configModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-xl modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content sp-modal">
                <div class="modal-body sp-modal-body">
                    <iframe id="configFrame" src="about:blank" title="Configuração de vagas"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="{{ url_for('static', filename='js/tests.js') }}"></script>
</body>

</html>
