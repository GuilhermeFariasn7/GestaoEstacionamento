<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Smart Parking | Revisão</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}">
<style>.sample-image{width:100%;max-height:68vh;object-fit:contain;background:#14141f;border-radius:10px}.truth-btn.active{box-shadow:0 0 0 3px rgba(255,255,255,.25) inset}.metric-card{min-height:100px}</style>
</head>
<body>
<nav class="navbar navbar-dark sp-nav"><div class="container-fluid"><span class="navbar-brand fw-semibold"><i class="bi bi-p-square-fill me-2"></i>Smart Parking — Experimentos</span><div class="navbar-nav ms-auto flex-row gap-3"><a class="nav-link active" href="/tests">Experimentos</a></div></div></nav>
<main class="container-fluid py-4"><div class="row g-4">
<div class="col-xl-8"><div class="card sp-card"><div class="card-body p-3"><div class="d-flex justify-content-between align-items-center mb-3"><div><h4 class="mb-1">Revisão manual</h4><div id="sampleInfo" class="text-secondary">Carregando...</div></div><div class="btn-group"><button id="prev" class="btn btn-outline-secondary">Anterior</button><button id="next" class="btn btn-outline-secondary">Próxima</button></div></div><img id="sampleImage" class="sample-image" alt="Amostra do teste"></div></div></div>
<div class="col-xl-4"><div class="card sp-card mb-3"><div class="card-body"><h5>Gabarito da amostra</h5><p class="text-secondary small">Para cada vaga, marque o que realmente aparece na imagem. O resultado automático fica ao lado para conferência.</p><div id="regions"></div><button id="save" class="btn btn-primary w-100 mt-3"><i class="bi bi-save me-1"></i>Salvar amostra</button><div id="saveStatus" class="small text-secondary mt-2"></div></div></div>
<div class="card sp-card"><div class="card-body"><h5>Métricas</h5><div class="row g-2" id="metricsCards"></div><div id="metricsText" class="small text-secondary mt-3"></div><div id="regionMetrics" class="table-responsive mt-3"></div><a id="metricsDownload" class="btn btn-outline-success w-100 mt-3" href="#"><i class="bi bi-file-earmark-spreadsheet me-1"></i>Baixar métricas CSV</a></div></div></div>
</div></main>
<script>
const api=()=>localStorage.getItem('smartparking:roiApiUrl')||'http://127.0.0.1:5001';
const jobId='{{ job_id }}';
let samples=[],index=0,offset=0,total=0,pageSize=100,regions=[],truth={};
async function req(p,o={}){const r=await fetch(api()+p,o);if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||'Erro');return r;}
function pct(v){return v==null?'—':(v*100).toFixed(2)+'%';}
async function loadPage(newOffset=0){
    const d=await(await req('/api/tests/'+jobId+'/samples?offset='+newOffset+'&limit='+pageSize)).json();
    samples=d.samples;regions=d.regions;offset=d.offset;total=d.total;index=0;
    if(!samples.length)throw new Error('Este teste não possui amostras.');
    render();
}
async function goNext(){
    if(index<samples.length-1){index++;render();return;}
    if(offset+samples.length<total){await loadPage(offset+pageSize);}
}
async function goPrev(){
    if(index>0){index--;render();return;}
    if(offset>0){await loadPage(Math.max(0,offset-pageSize));index=samples.length-1;render();}
}
function render(){
    const s=samples[index];truth=Object.assign({},s.truth||{});
    sampleImage.src=api()+'/api/tests/'+jobId+'/samples/'+encodeURIComponent(s.image);
    sampleInfo.textContent=`Amostra ${s.sample+1} de ${total} · frame ${s.frame}${s.timestamp_s!==''?' · '+s.timestamp_s+' s':''}${s.tracking_estavel!==''?' · rastreamento '+(String(s.tracking_estavel)==='true'?'OK':'sem correspondência'):''}`;
    regionsEl.innerHTML=regions.map(n=>{const t=truth[n],det=s.detections[n];return `<div class="border rounded p-2 mb-2"><div class="d-flex justify-content-between align-items-center mb-2"><strong>${n}</strong><span class="badge ${det==='ocupada'?'text-bg-danger':(det==='fora_de_vista'?'text-bg-secondary':'text-bg-success')}">YOLO: ${det==='fora_de_vista'?'fora de vista':det}</span></div><div class="btn-group w-100"><button class="btn btn-sm btn-outline-danger truth-btn ${t===true?'active':''}" onclick="setTruth('${esc(n)}',true)">Ocupada</button><button class="btn btn-sm btn-outline-success truth-btn ${t===false?'active':''}" onclick="setTruth('${esc(n)}',false)">Livre</button></div></div>`}).join('');
    prev.disabled=index===0&&offset===0;
    next.disabled=index===samples.length-1&&offset+samples.length>=total;
    updateMetrics();
}
function esc(s){return s.replaceAll('\\','\\\\').replaceAll("'","\\'");}
function setTruth(n,v){truth[n]=v;render();}
async function save(){
    if(Object.keys(truth).length<regions.length){if(!confirm('Nem todas as vagas desta amostra foram marcadas. Salvar mesmo assim?'))return;}
    try{await req('/api/tests/'+jobId+'/ground-truth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({annotations:{[samples[index].sample]:truth}})});samples[index].truth=Object.assign({},truth);saveStatus.textContent='Gabarito salvo.';updateMetrics();}
    catch(e){saveStatus.textContent=e.message;}
}
async function updateMetrics(){
    try{const m=await(await req('/api/tests/'+jobId+'/metrics')).json();const o=m.overall||{};metricsCards.innerHTML=[['Acurácia',pct(o.accuracy)],['Precisão',pct(o.precision)],['Recall',pct(o.recall)],['FPR',pct(o.false_positive_rate)]].map(x=>`<div class="col-6"><div class="border rounded p-2 metric-card"><div class="small text-secondary">${x[0]}</div><strong>${x[1]}</strong></div></div>`).join('');metricsText.textContent=`Amostras avaliadas: ${m.annotated_samples}/${m.total_samples}. Comparações vaga/amostra: ${m.annotated_cells}/${m.total_cells}. Acertos: ${o.correct||0}. Erros: ${o.errors||0}. TP ${o.tp||0} · FP ${o.fp||0} · TN ${o.tn||0} · FN ${o.fn||0}.`;regionMetrics.innerHTML='<table class="table table-sm align-middle"><thead><tr><th>Vaga</th><th>Acertos</th><th>Erros</th><th>Acurácia</th><th>Precisão</th><th>Recall</th><th>FPR</th></tr></thead><tbody>'+Object.entries(m.per_region||{}).map(([n,v])=>`<tr><td>${n}</td><td>${v.correct||0}</td><td>${v.errors||0}</td><td>${pct(v.accuracy)}</td><td>${pct(v.precision)}</td><td>${pct(v.recall)}</td><td>${pct(v.false_positive_rate)}</td></tr>`).join('')+'</tbody></table>';metricsDownload.href=api()+'/api/tests/'+jobId+'/metrics/download';}
    catch(e){metricsText.textContent=e.message;}
}
prev.onclick=()=>goPrev();next.onclick=()=>goNext();save.onclick=save;const regionsEl=document.getElementById('regions');loadPage().catch(e=>{sampleInfo.textContent=e.message;});
</script></body></html>
